name: spimaging
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy<2
  - scipy
  - h5py
  # Keep the HDF5 runtime aligned with the current conda-forge h5py build.
  - hdf5=2.1
  - imageio
  - scikit-image
  - matplotlib
  - tk
  - tqdm
  - pytest
  - pip:
      - opencv-python
      - -e .
