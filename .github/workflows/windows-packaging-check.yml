name: Windows packaging checks

on:
  pull_request:
    paths:
      - "launcher/**"
      - "packaging/**"
      - "tests/test_launcher.py"
      - "tests/test_release_manifest.py"
      - ".github/workflows/windows-*.yml"
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - "packaging/**"
      - "tests/test_launcher.py"
      - "tests/test_release_manifest.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test runner only
        run: python -m pip install --disable-pip-version-check pytest
      - name: Launcher unit tests (no network)
        run: python -m pytest -q tests/test_launcher.py tests/test_release_manifest.py
      - name: Validate example manifest contract
        run: >-
          python packaging/scripts/verify_release_manifest.py
          packaging/manifests/release-manifest.unsigned-beta.example.json
      - name: Compile launcher and packaging Python
        run: >-
          python -m compileall -q launcher packaging/scripts
